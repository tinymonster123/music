name: Deploy Next.js Docker to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置 QEMU 以支持多架构构建
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nextjs-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 在服务器上部署
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 创建目录存储密钥
            mkdir -p /root/app/src/ssh
            chmod 700 /root/app/src/ssh

            echo "${{ secrets.SSH_KEY_CONTENT }}" | base64 -d > /root/app/src/ssh/ting.pem
            chmod 600 /root/app/src/ssh/ting.pem

            # 创建环境变量
            cat > /root/app/.env << EOL
            SSH_HOST=47.121.193.152
            SSH_USER=root
            SSH_KEY_PATH=/app/src/ssh/ting.pem
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            NEXT_PUBLIC_AUTHORIZE_URL=${{ secrets.AUTHORIZE_URL }}
            AUTHORIZE_URL=${{ secrets.AUTHORIZE_URL }}
            BASE_URL=${{ secrets.BASE_URL }}
            TEXT2SQL_URL=${{ secrets.TEXT2SQL_URL }}
            SERVER_IP=${{ secrets.SERVER_IP }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            AUTH_GITHUB_ID=${{ secrets.AUTH_GITHUB_ID }}
            AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
            EOL

            # 拉取最新镜像
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nextjs-app:latest

            # 停止并删除旧容器
            docker stop nextjs-app || true
            docker rm nextjs-app || true

            # 运行新容器
            docker run -d \
              --name nextjs-app \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file /root/app/.env \
              -v /root/app/src/ssh:/app/src/ssh:ro \
              ${{ secrets.DOCKERHUB_USERNAME }}/nextjs-app:latest

            # 清理未使用的镜像
            docker image prune -f
