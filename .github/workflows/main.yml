name: Deploy Next.js Docker to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置 QEMU 以支持多架构构建
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nextjs-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 复制配置文件到服务器
      - name: Copy configuration files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.prod.yml"
          target: "/app/"
          strip_components: 0
          overwrite: true
          debug: true

      # 在服务器上部署
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 创建应用目录
            mkdir -p /root/app
            cd /root/app

            # 创建 secrets 目录
            mkdir -p secrets
            chmod 700 secrets

            # 创建 secret 文件
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > secrets/ssh_key.txt
            echo "${{ secrets.DATABASE_URL }}" > secrets/database_url.txt
            echo "${{ secrets.DB_USER }}" > secrets/db_user.txt
            echo "${{ secrets.DB_PASSWORD }}" > secrets/db_password.txt
            echo "${{ secrets.DB_HOST }}" > secrets/db_host.txt
            echo "${{ secrets.DB_PORT }}" > secrets/db_port.txt
            echo "${{ secrets.DB_NAME }}" > secrets/db_name.txt
            echo "${{ secrets.AUTHORIZE_URL }}" > secrets/authorize_url.txt
            echo "${{ secrets.BASE_URL }}" > secrets/base_url.txt
            echo "${{ secrets.TEXT2SQL_URL }}" > secrets/text2sql_url.txt
            echo "${{ secrets.NEXTAUTH_SECRET }}" > secrets/nextauth_secret.txt
            echo "${{ secrets.NEXTAUTH_URL }}" > secrets/nextauth_url.txt
            echo "${{ secrets.AUTH_GITHUB_ID }}" > secrets/auth_github_id.txt
            echo "${{ secrets.AUTH_GITHUB_SECRET }}" > secrets/auth_github_secret.txt

            # 设置文件权限
            chmod 600 secrets/*.txt

            # 初始化 Docker Swarm（如果尚未初始化）
            docker swarm init || true

            # 拉取最新镜像
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nextjs-app:latest

            # 部署或更新服务
            docker stack deploy -c docker-compose.prod.yml nextjs-app

            # 等待服务启动
            sleep 10

            # 检查服务状态
            docker service ls
            docker service ps nextjs-app_app

            # 清理敏感文件
            rm -rf secrets/
